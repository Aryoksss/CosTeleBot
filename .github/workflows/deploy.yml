name: Deploy to VPS

# Trigger: tiap push ke main, atau jalankan manual dari tab Actions.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Cegah deploy paralel saling tabrakan; pakai yang terbaru.
concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  # Cek sintaks semua file JS dulu — kalau ada error, deploy TIDAK dijalankan.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check semua file JS
        run: |
          set -e
          fail=0
          for f in $(git ls-files '*.js'); do
            node --check "$f" || { echo "::error file=$f::Syntax error"; fail=1; }
          done
          [ "$fail" = "0" ] && echo "Semua JS lolos node --check ✅"
          exit $fail

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            cd "${{ secrets.VPS_PATH }}"
            FORCE_RELOAD=1 bash deploy.sh
