name: Deploy to VPS

# Trigger: tiap push ke main, atau jalankan manual dari tab Actions.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Cegah deploy paralel saling tabrakan; pakai yang terbaru.
concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            cd "${{ secrets.VPS_PATH }}"
            FORCE_RELOAD=1 bash deploy.sh
